<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Projections onto AR(p) and Pythagoras</title>
<desc>Left: the spectrum of the MA(1) process with b = 0.5 and the spectra of its m-projections onto AR(1) and AR(2) (Yule-Walker) and of its e-projection onto AR(1), which is a different AR(1) model. Right: stacked bars for p = 0 to 5 showing the Pythagorean relation of (10.57) for an ARMA(1,1) spectrum: the sum of the divergence from the process to its AR(p) projection and from the projection to white noise is the same for every p.</desc>
