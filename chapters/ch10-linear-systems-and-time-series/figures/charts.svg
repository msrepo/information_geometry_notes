<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img">
<title>AR is e-flat, MA is m-flat</title>
<desc>Left: the AR(1) models with free innovation variance fill the cone r_0 > 2|r_1| of the plane of the first two inverse autocovariances; the e-geodesic between two of them is a straight line inside the cone, while the m-geodesic, the straight mixture of the spectra, is a curve that has non-zero r_2 and so leaves AR(1). Right: the MA(1) models fill the cone gamma_0 > 2|gamma_1| of the plane of the first two autocovariances; the m-geodesic is straight and stays in MA(1) while the e-geodesic bends and leaves it. The dotted parabola is the gain-pinned one-parameter family in each chart.</desc>
