<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Maximum entropy needs the zeroth coefficient</title>
<desc>Left: the entropy rate along three directions inside the set of spectra with the same first two autocovariances as an AR(1) model is largest at the AR(1) model, which is Theorem 10.2. Right: if the zeroth autocovariance is not held fixed, adding white noise c to the spectrum raises the entropy without bound, like one half of the logarithm of c; dually, adding c to the inverse spectrum lowers it without bound, so the printed Theorems 10.2 and 10.3, which list only r_1 to r_p, need r_0 as well.</desc>
