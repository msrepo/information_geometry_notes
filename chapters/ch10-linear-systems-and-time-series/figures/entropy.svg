<text class="sm" x="75" y="390">Left: moving inside M<tspan dy="3.5" font-size="8.5">1</tspan><tspan dy="-3.5" xml:space="preserve">(r) (autocovariances γ</tspan><tspan dy="3.5" font-size="8.5">0</tspan><tspan dy="-3.5" xml:space="preserve">, γ</tspan><tspan dy="3.5" font-size="8.5">1</tspan><tspan dy="-3.5" xml:space="preserve"> held) can only lower the entropy: the first-order term vanishes by orthogonality.</tspan></text>
<text class="sm" x="75" y="405">Right: if γ<tspan dy="3.5" font-size="8.5">0</tspan><tspan dy="-3.5" xml:space="preserve"> (or r</tspan><tspan dy="3.5" font-size="8.5">0</tspan><tspan dy="-3.5" xml:space="preserve">) is not held, entropy is unbounded above (below); the dashed lines are ±(1/2) log c.</tspan></text>
