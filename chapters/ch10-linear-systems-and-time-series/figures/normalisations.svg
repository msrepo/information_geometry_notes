<text class="sm" x="766.8" y="166.6" text-anchor="end">AR(1): n |H<tspan dy="-4.5" font-size="8.5">m</tspan><tspan dy="4.5" xml:space="preserve">|², limit 6.25</tspan></text>
<text class="sm" x="766.8" y="209.2" text-anchor="end">MA(1): n |H<tspan dy="-4.5" font-size="8.5">e</tspan><tspan dy="4.5" xml:space="preserve">|², limit 5.33</tspan></text>
<text class="sm" x="766.8" y="317.4" text-anchor="end">MA(1): |H<tspan dy="-4.5" font-size="8.5">m</tspan><tspan dy="4.5" xml:space="preserve">|² = 0 for every n</tspan></text>
<text class="sm" x="75" y="390">Left: the printed (10.37) is twice the Kullback-Leibler divergence per observation of a Gaussian series</text>
<text class="sm" x="75" y="405">(exact Toeplitz covariances); the error of KL/n times n is a constant.</text>
<text class="sm" x="75" y="420">Right: AR(1) is e-flat only up to boundary terms: its squared e-curvature falls like 1/n² (the curve rises</text>
<text class="sm" x="75" y="435">to a constant); the m-curvature of AR(1) and the e-curvature of MA(1) fall like 1/n.</text>
</svg>
