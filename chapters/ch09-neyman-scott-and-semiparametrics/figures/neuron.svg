<text class="sm" x="514" y="265.5">S: (9.132), unbounded influence</text>
<line class="s3" style="stroke-width:2.2" x1="486" y1="278" x2="508" y2="278"/>
<text class="sm" x="514" y="281.5">L<tspan dy="3.5" font-size="8.5">V</tspan><tspan dy="-3.5">: (9.133), bounded influence</tspan></text>
<text class="sm" x="70" y="372">Left: the joint MLE tends to about 2κ₀ for large κ₀ (dots: the exact limits); the efficient estimating equation is consistent at every κ₀.</text>
<text class="sm" x="70" y="387">Right: S is the efficient statistic, the more robust one is L<tspan dy="3.5" font-size="8.5">V</tspan><tspan dy="-3.5">: at ε = 0.001 the artefacts move S about 8 times as far as L</tspan><tspan dy="3.5" font-size="8.5">V</tspan><tspan dy="-3.5">.</tspan></text>
</svg>
