<text class="sm" x="64" y="372">Left: the efficient score is the part of the u-score orthogonal to the nuisance score; its length is the square root of the efficient</text>
<text class="sm" x="64" y="387">information. Right: for two parameters of interest the orthogonal nuisance coordinate does not exist, the lift does not close.</text>
</svg>
