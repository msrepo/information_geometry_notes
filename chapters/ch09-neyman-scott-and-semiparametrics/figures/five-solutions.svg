<svg viewBox="0 0 800 405" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Five solutions of the coefficient-of-proportionality problem</title>
<desc>Left: forty simulated specimens with the true line y = 2x and four fitted lines through the origin: least squares is pulled down, the average of the ratios y over x is far off, the gross average and total least squares are close to the truth. Right: running average of the ratios y over x for six independent runs up to a million pairs, which never settles, against the running gross average, which converges to 2.</desc>
