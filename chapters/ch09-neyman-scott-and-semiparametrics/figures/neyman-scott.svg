<text class="sm" x="766.7" y="199.0" text-anchor="end">u = 2: conditional estimator</text>
<text class="sm" x="70" y="372">Left: 4000 simulated data sets per N (exact sampling of the sum of squares); dots are means, bars ± 1 standard deviation of one data set.</text>
<text class="sm" x="70" y="387">Right: one data set per N. In both problems the joint MLE converges, to the wrong value; the estimating-function solution to the right one.</text>
</svg>
