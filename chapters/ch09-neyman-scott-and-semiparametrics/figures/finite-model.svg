<svg viewBox="0 0 800 405" xmlns="http://www.w3.org/2000/svg" role="img">
<title>An exact finite model for the geometry of estimating functions</title>
<desc>Left: the efficient score of the binomial-pairs model with m = 3 and odds ratio 2, shown on the four by four table of outcomes; it is the same vector for every mixing law of the nuisance parameter. Right: variance of the estimator from l_E plus t times an ancillary vector of the same norm: the parabola (1 plus t squared) over the efficient information from Theorem 9.6, with Monte Carlo points at N = 800 and N = 8000.</desc>
