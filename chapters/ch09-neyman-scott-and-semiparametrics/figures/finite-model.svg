<text class="sm" x="70" y="372">Left: l<tspan dy="3.5" font-size="8.5">E</tspan><tspan dy="-3.5"> = (y − E[y|s])/u, with s = x + y; it is the same for every mixing law k (orange positive, blue negative).</tspan></text>
<text class="sm" x="70" y="387">Right: any other estimating function adds an ancillary part a, orthogonal to l<tspan dy="3.5" font-size="8.5">E</tspan><tspan dy="-3.5">, and its variance grows with the square of it.</tspan></text>
