<svg viewBox="0 0 800 424" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The linear class of estimating functions</title>
<desc>Left: N times the variance of the root of the estimating equation with h(s) = s + c against c, for u = 2 and N = 500 specimens with weights spread as N(2,1): Monte Carlo dots agree with the corrected formula (9.103), whose minimum is at c = 2.005 as (9.105) says, and not with the formula as printed, which dips below the efficiency bound. Right: efficiency of total least squares (c = 0) and of the gross average (c = infinity) against the spread of the specimen weights, with a crossing at tau = 0.437.</desc>
