<text class="sm" x="70" y="372">Left: at fixed (s, r, z) the two smallest eigenvalues of the Fisher matrix scale like u⁶ and u²; a layer-wise block</text>
<text class="sm" x="70" y="387">approximation keeps the null vectors on the overlap set but is only of order u² small. Right: the exact plain-gradient flow (dots:</text>
<text class="sm" x="70" y="402">bisection at u₀ = 0.4 and 0.2) has a wedge-shaped basin next to |z| = 1, as the printed separatrix says: finite measure, not stable.</text>
