<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The Fisher matrix near the overlap singularity and the basin of the stable part</title>
<desc>Left: on logarithmic axes the four eigenvalues of the Fisher matrix of the two-neuron perceptron against the distance u between the two input weights: two stay of order one, the second smallest falls like u squared and the smallest like u to the sixth, and a layer-wise block-diagonal approximation falls like u squared in both small directions. Right: in the plane of z and u, the basin of the stable part of the overlap singularity for a teacher with K positive is a wedge between the line z equal to 1 and the printed separatrix; dots are bisection results on the exact flow.</desc>
