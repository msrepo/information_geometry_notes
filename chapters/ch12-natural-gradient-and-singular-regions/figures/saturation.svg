<svg viewBox="0 0 800 405" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Saturation: natural against plain gradient on one neuron</title>
<desc>Left: on logarithmic axes, for one erf neuron with noise variance 1 and true weight 1, the squared size of the plain gradient falls like w to the minus 3, the natural gradient's Riemannian size stays between 1 and 1.4, and the squared size of the natural step in weight units grows like w cubed, reaching 3100 at w = 8. Right: distance to the true weight against the number of iterations for the averaged plain gradient with step 1, which needs 124 iterations, and the averaged natural gradient with step 0.5, which needs 4; dots show medians of online runs.</desc>
