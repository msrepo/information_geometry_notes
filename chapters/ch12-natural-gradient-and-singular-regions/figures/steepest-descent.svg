<svg viewBox="0 0 800 405" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Steepest descent in a metric, and chart dependence</title>
<desc>Left: in the plane of parameter steps a, the ellipse a transpose G a equals one and the Euclidean unit circle, the gradient of the loss, the plain gradient direction scaled to the ellipse and the natural gradient direction G inverse times the gradient, which is where the line of constant decrease touches the ellipse. Right: probability of the Bernoulli model against time under three flows started at 0.01 with target 0.9: the natural gradient flow is the same curve in the logit chart and in the probability chart, 0.9 minus 0.89 exp(-t), while the plain gradient flows differ strongly between charts.</desc>
