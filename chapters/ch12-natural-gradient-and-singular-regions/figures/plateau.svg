<text class="sm" x="70" y="372">Left: the plain gradient flow slows down (u ~ t<tspan dy="-4.5" font-size="8.5">−1/2</tspan><tspan dy="4.5">, L ~ t⁻²); the natural flow has L ~ e</tspan><tspan dy="-4.5" font-size="8.5">−2t</tspan><tspan dy="4.5">. Right: the plain flow</tspan></text>
<text class="sm" x="70" y="387">stays at the plateau value L₁ for ever (z₀ = 1.5) or leaves after t ≈ 40 (z₀ = 0.6); the natural flow from z₀ = 0.6 is below L₁/2</text>
<text class="sm" x="70" y="402">at t ≈ 0.4. All curves are the averaged flow (12.129) of the two-neuron perceptron, from closed forms.</text>
</svg>
