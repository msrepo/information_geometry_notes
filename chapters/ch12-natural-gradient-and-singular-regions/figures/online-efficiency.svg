<svg viewBox="0 0 800 405" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Online learning: natural against plain gradient</title>
<desc>Left: on logarithmic axes, the ratio of the online error variance times t to its Cramér–Rao value against t for a Gaussian linear model with two directions whose Fisher eigenvalues are 1 and 0.04: the natural gradient with c = 1 tends to 1, with c = 2 to 4/3; the plain gradient with c = 25 tends to 12.8 in the steep direction and 1 in the flat one, and with c = 1 the flat direction diverges. Right: the asymptotic factor x squared over 2x minus 1, minimal and equal to 1 at x = 1, with the cases marked.</desc>
