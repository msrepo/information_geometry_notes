<svg viewBox="0 0 780 392" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Checking the loop formula of Section 5.8</title>
<desc>Left: the measured difference of the two parallel transports round an infinitesimal quadrilateral, divided by the curvature term R A d1xi d2xi, tends to 1 as the loop shrinks, on the sphere and on the Gaussian manifold; the printed formula would give 2. Right: the sphere's curvature component with and without the quadratic connection terms that the printed (5.64) cancels.</desc>
