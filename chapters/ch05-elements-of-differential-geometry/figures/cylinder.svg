<svg viewBox="0 0 800 410" xmlns="http://www.w3.org/2000/svg" role="img">
<title>A cylinder: zero intrinsic curvature, non-zero embedding curvature</title>
<desc>Left: a cylinder in three-dimensional space with a helix whose acceleration points at the axis, perpendicular to the surface. Right: the cylinder unrolled into a flat sheet, where the same helix is a straight line.</desc>
