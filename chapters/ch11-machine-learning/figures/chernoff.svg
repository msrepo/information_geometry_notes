<svg viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Chernoff information of two Poisson distributions</title>
<desc>Left: minus the logarithm of the exact Bayes error divided by N against N for Poisson(2) versus Poisson(5), for equal priors and for priors 0.9 and 0.1; both tend to the Chernoff information 0.3397 from above. Right: along the e-geodesic between the two distributions the KL divergence to each end crosses at t star = 0.538, where the Chernoff function minus log of the sum of p1 to the 1 minus t times p2 to the t reaches its maximum 0.3397.</desc>
