<svg viewBox="0 0 800 495" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Conformal change of a kernel on a noisy-circle problem</title>
<desc>Left: the decision boundaries f = 0 of a Gaussian-kernel SVM trained on forty noisy-circle points, before and after the conformal modification of the kernel with kappa equal to 3; the support vectors are circled and the dashed circle is the true class boundary. Right: the paired change in test error over thirty runs for kappa equal to 1, 3 and 10, with two-standard-error bars: about plus 0.012, minus 0.007 and plus 0.058.</desc>
