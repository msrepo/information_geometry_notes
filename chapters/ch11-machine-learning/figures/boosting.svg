<svg viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>AdaBoost on a twenty-point toy problem</title>
<desc>Left: the weight alpha of each of ten boosting rounds as computed by AdaBoost, one half log of one minus epsilon over epsilon, against the weight given by exact maximum likelihood for the normalised model: at the first round the latter is exactly twice as large. Right: the training error and the product of the normalisers Z_t, which equals the mean exponential loss, over the ten rounds; the error is below the product at every round and reaches zero at round five.</desc>
