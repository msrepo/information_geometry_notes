<text class="sm" x="70" y="376">Left: at round 1 the exact maximum-likelihood weight is exactly twice AdaBoost's, which is the projection onto the unnormalised family (11.165).</text>
<text class="sm" x="70" y="391">Right: the training error stays below the product bound, which equals the mean exponential loss (Section 4 of the notes).</text>
