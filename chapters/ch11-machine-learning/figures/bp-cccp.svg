<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Belief propagation, mean field and CCCP on a four-cycle</title>
<desc>Left: the largest error of the belief propagation marginals and of the mean-field marginals against the exact ones on a four-spin cycle, for couplings from 0.1 to 1.2. Right: the belief of spin 0 over forty iterations at coupling 0.8 for the simplified CCCP, which oscillates between about plus and minus 0.9, for Yuille's CCCP, which creeps monotonically towards the BP fixed point near 0.52, and for BP itself; the exact marginal is 0.39.</desc>
