<svg viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Contrastive divergence and the Gaussian RBM</title>
<desc>Left: on a small binary RBM, the terms of the Pythagorean decomposition of KL from p0 to p on a log scale: the first term KL of p0 from p tilde 1 is about 0.25, the later terms fall geometrically to rounding level, and their sum is the total KL of 0.2543. Right: the two singular values of the weight matrix of a Gaussian RBM trained by maximum likelihood, CD1 and CD3 flows, all converging to 0.894 and 0.825, the values of the square root of one minus sigma v squared over lambda.</desc>
