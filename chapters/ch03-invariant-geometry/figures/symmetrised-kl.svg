<svg viewBox="0 0 800 410" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Theorem 3.2: the symmetrised KL divergence is the integrated Fisher information</title>
<desc>Left: the Fisher information along the e-geodesic (smooth, between 3.3 and 4.2) and along the m-geodesic (large near both ends) between p equal to (0.6, 0.38, 0.02) and q equal to (0.02, 0.38, 0.6); each has area 3.945, which is the sum of the two KL divergences, and the dashed lines mark that mean height and its half. Right: along a path towards q, the ratios of the integrals and of the symmetrised divergence to the squared Fisher-Rao distance stay just above 1, while half the symmetrised divergence stays near one half.</desc>
