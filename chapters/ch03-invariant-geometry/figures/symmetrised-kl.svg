<text class="sm" x="765.5" y="284.4" text-anchor="end">½ (D + D*) / s²: the printed left side</text>
<text class="sm" x="765.5" y="147.4" text-anchor="end">s² ≤ ∫g (Cauchy–Schwarz)</text>
<text class="sm" x="70" y="376">p = (.60,.38,.02), q = (.02,.38,.60). The Fisher information integrated along the e-geodesic and along the m-geodesic both equal D[p:q] + D[q:p]:</text>
<text class="sm" x="70" y="391">the factor ½ in (3.66) is wrong. Since s² ≤ ∫g for any curve of unit parameter length, ½ (D + D*) &lt; s² would be impossible.</text>
