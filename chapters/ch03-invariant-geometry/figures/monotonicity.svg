<svg viewBox="0 0 800 410" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Information monotonicity and what pins down the f-divergences</title>
<desc>Left: cumulative distribution of the ratio of the divergence after merging cells to the divergence before, over 20000 random merges, for the KL divergence (never above 1), the squared Euclidean distance (above 1 in a third of the cases) and a non-convex f. Right: for divergences p to the power a times f of q over p, the ratio at a sufficient merge equals 1 only for a equal to 1; for smaller a it is below 1, for larger a above 1.</desc>
