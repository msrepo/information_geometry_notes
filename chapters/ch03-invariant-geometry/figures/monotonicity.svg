<text class="sm" x="70" y="376">Left: 20000 random merges of 6-outcome distributions; non-convex f is t/(1+t) with t = (u−1)². Every f-divergence stays at or below 1,</text>
<text class="sm" x="70" y="391">the Euclidean distance exceeds it in 33% of the cases. </text>
<text class="sm" x="70" y="406">Right: the same f, weighted by p<tspan dy="-4.5" font-size="8.5">a</tspan><tspan dy="4.5">. Only a = 1 (an f-divergence) gives exactly 1 when the merged cells have equal conditionals, and never more.</tspan></text>
