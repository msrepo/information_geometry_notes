<text class="sm" x="70" y="376">Left: the three embeddings h<tspan dy="3.5" font-size="8.5">r</tspan><tspan dy="-3.5"> of S₁ into S₂ that split the first outcome by (r, 1−r). Right: the Euclidean metric (a = 0) shrinks the split vector,</tspan></text>
<text class="sm" x="70" y="391">a > 1 stretches it; only the Fisher weight a = 1 returns exactly 1 for every split, which is what invariance asks.</text>
