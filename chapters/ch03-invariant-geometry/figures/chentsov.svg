<svg viewBox="0 0 800 410" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Markov embeddings and the Fisher metric</title>
<desc>Left: the triangle of distributions on three outcomes with three segments that are the images of the one-dimensional simplex under the embeddings that split the first outcome into two with proportions 0.2, 0.5 and 0.8; the Euclidean lengths in the picture differ (0.917, 0.866, 0.917) while the Fisher length of each image is pi. Right: the squared length of the split basis vector as a function of the weight exponent a, equal to 1 for every split only at a equal to 1.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .lab{font-size:11px;fill:#57564f} .hd{font-size:13px;font-weight:500;fill:#1a1a19}
  .sm{font-size:10.5px;fill:#57564f} .v{font-size:11px;fill:#1a1a19}
  .ax{stroke:#8a8880;stroke-width:0.9;fill:none} .gd{stroke:#e2e1da;stroke-width:0.6;fill:none}
  .s1{stroke:#2a78d6} .s2{stroke:#eb6834} .s3{stroke:#1baf7a} .s4{stroke:#eda100} .s0{stroke:#8a8880}
  .f1{fill:#2a78d6} .f2{fill:#eb6834} .f3{fill:#1baf7a} .f4{fill:#eda100} .f0{fill:#8a8880}
  .ln{stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .thin{stroke-width:1;fill:none}
  .dash{stroke-width:1.4;fill:none;stroke-dasharray:5 3}
  .con{stroke-width:0.9;fill:none;opacity:.75}
  .fillS{fill:#2a78d6;opacity:.08}
  .ring{stroke:#fdfdfc;stroke-width:1.5}
  .fillB{fill:#2a78d6;opacity:.85} .fillG{fill:#1baf7a;opacity:.85} .fillO{fill:#eb6834;opacity:.85}
  .sk{stroke:#1a1a19} .fk{fill:#1a1a19}
  .dot{stroke-width:1.2;fill:none;stroke-dasharray:1.5 3.5;stroke-linecap:round}
  @media (prefers-color-scheme: dark){
    .lab,.sm{fill:#b6b4ab} .hd,.v{fill:#eceae3} .ax{stroke:#85837b} .gd{stroke:#33312e}
    .s1{stroke:#3987e5} .s2{stroke:#d95926} .s3{stroke:#199e70} .s4{stroke:#c98500} .s0{stroke:#85837b}
    .f1{fill:#3987e5} .f2{fill:#d95926} .f3{fill:#199e70} .f4{fill:#c98500} .f0{fill:#85837b}
    .fillS{fill:#3987e5}
    .ring{stroke:#161615}
    .fillB{fill:#3987e5} .fillG{fill:#199e70} .fillO{fill:#d95926}
    .sk{stroke:#eceae3} .fk{fill:#eceae3}
  }
</style>
<text class="hd" x="70" y="44">Splitting one outcome in two: the image of S₁ inside S₂</text>
<polyline class="thin s0" points="122.0,248.0 337.0,248.0 229.5,61.8 122.0,248.0"/>
<polyline class="ln s1" points="229.5,61.8 294.0,248.0"/>
<text class="sm" x="290.0" y="263.0" text-anchor="middle">r = 0.2</text>
<polyline class="ln s3" points="229.5,61.8 229.5,248.0"/>
<text class="sm" x="229.5" y="263.0" text-anchor="middle">r = 0.5</text>
<polyline class="ln s2" points="229.5,61.8 165.0,248.0"/>
<text class="sm" x="169.0" y="263.0" text-anchor="middle">r = 0.8</text>
<text class="v" x="70" y="288">Euclid length in the picture, r = .2, .5, .8: 0.917, 0.866, 0.917</text>
<text class="v" x="70" y="305">Fisher length of each image: 3.1416, 3.1416, 3.1416</text>
<text class="sm" x="70" y="322">all equal to π: S₁ is a quarter circle of radius 2 for every r</text>
