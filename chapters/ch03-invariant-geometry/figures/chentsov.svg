<text class="sm" x="674.5" y="321" text-anchor="middle">1.5</text>
<line class="gd" x1="742.7" y1="56" x2="742.7" y2="306"/>
<text class="sm" x="742.7" y="321" text-anchor="middle">2</text>
<line class="ax" x1="470" y1="306" x2="770" y2="306"/>
<line class="ax" x1="470" y1="56" x2="470" y2="306"/>
<text class="lab" x="620.0" y="338" text-anchor="middle">a  (the metric is Σ Z²/p^a)</text>
<text class="lab" transform="translate(430,181.0) rotate(-90)" text-anchor="middle">‖ẽ‖² / ‖e‖² = Σ rᵢ^(2−a)</text>
