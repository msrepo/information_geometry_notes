<svg viewBox="0 0 800 425" xmlns="http://www.w3.org/2000/svg" role="img">
<title>α-means and seat apportionment</title>
<desc>Left: the α-mean of 1 and 4 decreases from 4 (the maximum) at alpha minus infinity through 2.5 (arithmetic), 2.25, 2 (geometric) and 1.6 (harmonic) to 1 (the minimum) at alpha plus infinity. Right: for nine seats and four states with populations 1.3, 6.6, 21.1 and 6.8, the integer allocation that minimises the alpha-divergence changes from (1,2,4,2) for alpha below minus 4.2 to (1,1,5,2) up to 0.27, to (0,2,5,2) up to 34, and to (0,1,6,2) beyond.</desc>
