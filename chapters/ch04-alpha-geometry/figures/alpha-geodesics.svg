<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>α-geodesics and curvature on the three-outcome simplex</title>
<desc>Left: the equilateral triangle of distributions on three outcomes with the normalised α-geodesics from p = (0.6, 0.3, 0.1) to q = (0.1, 0.3, 0.6) for α = −1 (a straight line), 0, 1 and 3, bending progressively. Right: the curvature of the α-connection of the simplex, measured numerically at one point, lies on the parabola (1 minus alpha squared) over 4 and is zero only at alpha = plus or minus 1.</desc>
