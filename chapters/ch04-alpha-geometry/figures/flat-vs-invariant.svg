<text class="sm" x="70" y="375">Left: the mixed derivative of D<tspan dy="3.5" font-size="8.5">α</tspan><tspan dx="3" dy="-3.5">stacked over 14 × 14 points of S</tspan><tspan dy="3.5" font-size="8.5">2</tspan><tspan dx="3" dy="-3.5">has rank 2 for α = ±1 (as any Bregman</tspan></text>
<text class="sm" x="70" y="390">divergence must, in any coordinates) and rank 3 otherwise. Right: invariance means D[Tp:Tr] ≤ D[p:r];</text>
<text class="sm" x="70" y="405">the other flat divergences (Euclidean, β, q-escort) violate it, by up to about 0.27 here.</text>
