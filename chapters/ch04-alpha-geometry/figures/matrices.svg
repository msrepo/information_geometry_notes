<svg viewBox="0 0 800 415" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Invariance under scaling and the third-order term of the log-det family</title>
<desc>Left: logarithm base 2 of D[cP:cQ] over D[P:Q] against log2 of c for six matrix divergences: lines of slope 0 for the Stein divergence and the log-det divergence, slope 1 for the von Neumann and alpha = 0 divergences and slope 2 for the Frobenius and (alpha,beta) divergences. Right: the third-order coefficient of the per-eigenvalue function of the (alpha,beta)-log-det divergence tends to (beta minus alpha) over 6 as t tends to 0, equal to minus one sixth for (1,0) and (2,1), plus one sixth for (0,1) and zero for (0,0) and (1,1).</desc>
