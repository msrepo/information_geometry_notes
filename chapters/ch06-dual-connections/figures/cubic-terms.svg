<text class="sm" x="70" y="372">Left: every divergence with the Fisher metric starts at the same value; the slope at s = 0 is the cubic term, and it differs.</text>
<text class="sm" x="70" y="387">Right: that slope is a straight line in α, determined by T: this is what (6.34) and (6.38) say, and why α-geometry is the whole invariant family.</text>
