<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The canonical divergence of a general dual pair</title>
<desc>Left: bars for the values of the primal and dual pieces of the canonical divergence, their mean, the two alpha divergences with alpha plus and minus one half, and half the squared Fisher-Rao distance, between the same two Gaussians for the alpha equals one half structure; the first three are almost equal. Right: on a logarithmic scale, the largest angle in degrees between the normal of a divergence ball and the geodesic direction, for five cases: it is below one millionth of a degree for Bregman divergences and for the alpha divergence on the simplex, about a thousandth to a hundredth for the canonical divergence, and up to about one degree for the alpha divergence on the Gaussians.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
  .lab{font-size:11px;fill:#57564f} .hd{font-size:13px;font-weight:500;fill:#1a1a19}
  .sm{font-size:10.5px;fill:#57564f} .v{font-size:11px;fill:#1a1a19}
  .ax{stroke:#8a8880;stroke-width:0.9;fill:none} .gd{stroke:#e2e1da;stroke-width:0.6;fill:none}
  .s1{stroke:#2a78d6} .s2{stroke:#eb6834} .s3{stroke:#1baf7a} .s4{stroke:#eda100} .s0{stroke:#8a8880}
  .f1{fill:#2a78d6} .f2{fill:#eb6834} .f3{fill:#1baf7a} .f4{fill:#eda100} .f0{fill:#8a8880}
  .ln{stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .thin{stroke-width:1;fill:none}
  .dash{stroke-width:1.4;fill:none;stroke-dasharray:5 3}
  .con{stroke-width:0.9;fill:none;opacity:.75}
  .fillS{fill:#2a78d6;opacity:.08}
  .ring{stroke:#fdfdfc;stroke-width:1.5}
  .fillB{fill:#2a78d6;opacity:.85} .fillG{fill:#1baf7a;opacity:.85} .fillO{fill:#eb6834;opacity:.85}
  .sk{stroke:#1a1a19} .fk{fill:#1a1a19}
  .dot{stroke-width:1.2;fill:none;stroke-dasharray:1.5 3.5;stroke-linecap:round}
  @media (prefers-color-scheme: dark){
    .lab,.sm{fill:#b6b4ab} .hd,.v{fill:#eceae3} .ax{stroke:#85837b} .gd{stroke:#33312e}
    .s1{stroke:#3987e5} .s2{stroke:#d95926} .s3{stroke:#199e70} .s4{stroke:#c98500} .s0{stroke:#85837b}
    .f1{fill:#3987e5} .f2{fill:#d95926} .f3{fill:#199e70} .f4{fill:#c98500} .f0{fill:#85837b}
    .fillS{fill:#3987e5}
    .ring{stroke:#161615}
    .fillB{fill:#3987e5} .fillG{fill:#199e70} .fillO{fill:#d95926}
    .sk{stroke:#eceae3} .fk{fill:#eceae3}
  }
</style>
<line class="gd" x1="130" y1="276.6" x2="400" y2="276.6"/>
<text class="sm" x="124" y="280.1" text-anchor="end">0.11</text>
<line class="gd" x1="130" y1="217.8" x2="400" y2="217.8"/>
<text class="sm" x="124" y="221.3" text-anchor="end">0.13</text>
<line class="gd" x1="130" y1="158.9" x2="400" y2="158.9"/>
<text class="sm" x="124" y="162.4" text-anchor="end">0.15</text>
<line class="gd" x1="130" y1="100.1" x2="400" y2="100.1"/>
<text class="sm" x="124" y="103.6" text-anchor="end">0.17</text>
<line class="ax" x1="130" y1="306" x2="400" y2="306"/>
<line class="ax" x1="130" y1="56" x2="130" y2="306"/>
<text class="lab" x="265.0" y="338" text-anchor="middle"></text>
<text class="lab" transform="translate(90,181.0) rotate(-90)" text-anchor="middle">divergence between p = (1, 2) and q = (1.8, 2.7)</text>
<text class="hd" x="130" y="44">Divergences of the α = 0.5 pair</text>
<rect class="fillB" x="136.8" y="107.1" width="31.5" height="198.9"/>
<text class="sm" x="152.5" y="103.1" text-anchor="middle">0.1676</text>
<text class="sm" x="152.5" y="320" text-anchor="middle">D̃</text>
<rect class="fillB" x="181.8" y="107.1" width="31.5" height="198.9"/>
<text class="sm" x="197.5" y="103.1" text-anchor="middle">0.1676</text>
<text class="sm" x="197.5" y="320" text-anchor="middle">D̃*</text>
<rect class="fillB" x="226.8" y="107.1" width="31.5" height="198.9"/>
<text class="sm" x="242.5" y="103.1" text-anchor="middle">0.1676</text>
<text class="sm" x="242.5" y="320" text-anchor="middle">D, (6.80)</text>
<rect class="fillO" x="271.8" y="122.6" width="31.5" height="183.4"/>
<text class="sm" x="287.5" y="118.6" text-anchor="middle">0.1624</text>
<text class="sm" x="287.5" y="320" text-anchor="middle">D<tspan dy="3.5" font-size="8.5">0.5</tspan><tspan dy="-3.5">[p:q]</tspan></text>
<rect class="fillO" x="316.8" y="221.3" width="31.5" height="84.7"/>
<text class="sm" x="332.5" y="217.3" text-anchor="middle">0.1288</text>
<text class="sm" x="332.5" y="320" text-anchor="middle">D<tspan dy="3.5" font-size="8.5">−0.5</tspan><tspan dy="-3.5">[p:q]</tspan></text>
<rect class="fillG" x="361.8" y="164.3" width="31.5" height="141.7"/>
<text class="sm" x="377.5" y="160.3" text-anchor="middle">0.1482</text>
<text class="sm" x="377.5" y="320" text-anchor="middle">½ d²</text>
<text class="sm" x="547.2" y="321" text-anchor="middle">10⁻⁷</text>
<text class="sm" x="601.5" y="321" text-anchor="middle">10⁻⁵</text>
<text class="sm" x="655.9" y="321" text-anchor="middle">10⁻³</text>
<text class="sm" x="710.2" y="321" text-anchor="middle">10⁻¹</text>
<text class="sm" x="764.6" y="321" text-anchor="middle">10</text>
<line class="ax" x1="520" y1="306" x2="770" y2="306"/>
<line class="ax" x1="520" y1="56" x2="520" y2="306"/>
<text class="lab" x="645.0" y="338" text-anchor="middle">angle in the condition (6.81), degrees</text>
<text class="lab" transform="translate(480,181.0) rotate(-90)" text-anchor="middle"></text>
<text class="hd" x="520" y="44">Does the normal point along the geodesic?</text>
<rect class="fillG" x="520.0" y="272.0" width="34.1" height="22"/>
<text class="sm" x="524.0" y="267.0">Bregman, α = ±1, Gaussians</text>
<text class="v" x="558.1" y="287.0">1.8e-07°</text>
<rect class="fillG" x="520.0" y="222.0" width="52.9" height="22"/>
<text class="sm" x="524.0" y="217.0">α-divergence on S₂</text>
<text class="v" x="576.9" y="237.0">8.9e-07°</text>
<rect class="fillO" x="520.0" y="172.0" width="145.0" height="22"/>
<text class="sm" x="524.0" y="167.0">(6.80) on S₂</text>
<text class="v" x="669.0" y="187.0">2.2e-03°</text>
<rect class="fillO" x="520.0" y="122.0" width="164.5" height="22"/>
<text class="sm" x="524.0" y="117.0">(6.80) on Gaussians</text>
<text class="v" x="688.5" y="137.0">1.1e-02°</text>
<rect class="fillO" x="520.0" y="72.0" width="220.2" height="22"/>
<text class="sm" x="524.0" y="67.0">α-divergence on Gaussians</text>
<text class="v" x="720.0" y="87.0">1.27°</text>
<text class="sm" x="60" y="372">Left: D̃ and D̃* agree to seven digits; the α-divergences differ from them and from ½d², though all share the geometry to third order.</text>
<text class="sm" x="60" y="387">Right: largest angle over the test points. Orthogonal to numerical precision: Bregman and the α-divergence on S₂.</text>
<text class="sm" x="60" y="402">Visibly not: the α-divergence on the Gaussians.</text>
</svg>
