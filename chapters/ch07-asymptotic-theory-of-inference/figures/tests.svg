<svg viewBox="0 0 800 405" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Efficiency of a test is the angle of its boundary</title>
<desc>Left: local power against delta for the efficient tests, whose boundary is orthogonal to the model, and for the tests based on the sample mean and the second moment, which lose two thirds and one ninth of the information; dots are simulations at N = 500. Right: in the plane of the observed point, the model N(u, u squared) and the boundaries of the three rejection regions at N = 100.</desc>
