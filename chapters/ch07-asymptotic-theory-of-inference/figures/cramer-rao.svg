<svg viewBox="0 0 800 405" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The Cramér–Rao bound and its fine print</title>
<desc>Left: for the exponential distribution the variance of the maximum likelihood estimator of the rate divided by the Cramér–Rao bound is N cubed over (N minus 1) squared times (N minus 2), tending to one as one plus four over N; the unbiased estimator has N over N minus 2; the sample mean attains the bound for the mean parameter. Right: Hodges' superefficient estimator of a Gaussian mean has N times mean squared error far below one at zero and far above one close to it.</desc>
