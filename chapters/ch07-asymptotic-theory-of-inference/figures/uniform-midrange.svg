<svg viewBox="0 0 800 405" xmlns="http://www.w3.org/2000/svg" role="img">
<title>A non-regular model: the midrange of a uniform sample</title>
<desc>Left: histogram of N times the error of the midrange for the uniform location family at N = 500, with the limiting Laplace density and a Gaussian of the same variance. Right: the excess kurtosis of that error tends to 3, the Laplace value, as N grows.</desc>
