<svg viewBox="0 0 800 405" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The second-order terms of Theorem 7.5, checked</title>
<desc>Left: N times the mean squared error of three bias-corrected estimators against N, from simulation, with the curves one third plus c over N predicted by Theorem 7.5. Right: the coefficient c as a stack of the m-connection term, the e-curvature term and the leaf's m-curvature term: the MLE of u has the first two, an estimator with curved leaves adds the third, and parametrising by the logarithm of u makes the first much larger.</desc>
