<text class="sm" x="62" y="372">Each dot is a number printed by the script: the loss is g<tspan dy="-4.5" font-size="8.5">X∣T</tspan><tspan dy="4.5">, the score variance inside the bin (or beyond the censoring point), as a fraction of g</tspan><tspan dy="-4.5" font-size="8.5">X</tspan><tspan dy="4.5">.</tspan></text>
<text class="sm" x="62" y="387">Left: small bins lose h²/12σ² of the information about μ and twice that about σ; coarse bins lose less than that law says. Right: censoring far</text>
<text class="sm" x="62" y="402">to the right loses little; moving the censoring point towards the centre removes the information carried by the tail.</text>
