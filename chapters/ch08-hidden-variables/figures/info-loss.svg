<svg viewBox="0 0 800 425" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Loss of information by grouping and by censoring</title>
<desc>Left: the fraction of the Fisher information about the mean and about the standard deviation of a Gaussian that is lost when the observation is replaced by the index of a bin of width h; for small h the losses are h squared over 12 and h squared over 6 (dotted), for coarse bins they are smaller. Right: the fraction lost when the observation is replaced by the minimum of x and a censoring point c; it is small for c large and grows as c moves towards the centre of the distribution.</desc>
