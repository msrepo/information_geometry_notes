<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The speed of EM is the fraction of missing information</title>
<desc>Left: the contraction factor of EM per step against the separation of the component means, for the symmetric mixture and for a mixture with weights 0.35 and 0.65. The curves are one minus the Fisher information of the marginal model over the complete-data information, and the largest eigenvalue of the inverse complete information times the missing information; dots are measured by running EM. The factor goes from 0 for far apart components to 1 for merging components. Right: the number of steps (logarithmic scale) needed to reduce the error by seven orders of magnitude, from the formula and from runs.</desc>
