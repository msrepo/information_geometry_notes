<text class="sm" x="475.9" y="76.8" text-anchor="start">m → 0: the rate tends to 1, the stall of section 3</text>
<text class="sm" x="62" y="372">Left: EM contracts the error by a fixed factor per step, and that factor is the largest fraction of the information about the parameter that</text>
<text class="sm" x="62" y="387">the hidden label withholds, (8.30)-(8.31). It tends to 0 when the components are far apart and to 1 when they merge. The curves come</text>
<text class="sm" x="62" y="402">from the information matrices, the dots from running EM. Right: the number of steps (logarithmic axis) to reduce the error by 10⁷,</text>
<text class="sm" x="62" y="417">from the formula (curve) and measured (dots; from a start 0.001 away, to an error below 1e-10; counts are whole steps).</text>
</svg>
