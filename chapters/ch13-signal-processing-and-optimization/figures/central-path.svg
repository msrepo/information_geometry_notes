<svg viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Linear programming: the central path and natural-gradient steps</title>
<desc>Left: a hexagon in the theta plane, the central path from its analytic centre to the optimal vertex, and the Euler iterates of the natural gradient flow with step sizes 0.4 and 0.1, which follow the path with a lag. Middle: the e-curvature of the path against t on a logarithmic axis, with two humps and a zero near t equal to 2.7. Right: log-log plot of the Euler error at t equal to 2, which falls like the step size, and of the error of one step from the centre, which falls like its square.</desc>
