<svg viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Matrix flows for principal and minor components</title>
<desc>Left: logarithm of the distance of M transpose M from its reference value against time for five matrix flows of section 13.1: the Oja subspace flow decays to rounding error, the flow (13.35) keeps the defect at its initial value, the flow (13.40) returns M transpose M to D squared, the printed flow (13.36) shrinks M towards zero and the ascent flow (13.34) diverges at t about 1.2. Right: absolute cosine between the i-th column of W and the i-th eigenvector for Oja's subspace flow, which stays near 0.33, and for the weighted flow of Xu, which tends to 1.</desc>
