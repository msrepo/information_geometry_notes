<svg viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The Hyvarinen score loses information outside the Gaussian</title>
<desc>Left: efficiency of the Hyvarinen score matching estimator of theta for densities proportional to exp(minus theta times the absolute value of x to the power k), equal to one for k equal to two and 0.8214 for k equal to three, the book's example, decreasing for larger k. Right: histograms of the maximum likelihood estimator and the Hyvarinen estimator of theta in 30000 samples of 400 observations from the example, both centred at 1.7, the second with a wider spread.</desc>
