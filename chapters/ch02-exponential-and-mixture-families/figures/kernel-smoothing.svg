<title>Kernel exponential family: smearing a weight function into a log density</title>
<desc>Left: a function theta of y with two positive bumps and one negative bump. Middle: the kernel-smoothed function f for a delta kernel, a narrow Gaussian kernel and a wide Gaussian kernel. Right: the resulting densities for the two Gaussian kernels.</desc>
