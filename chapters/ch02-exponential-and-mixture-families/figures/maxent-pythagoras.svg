<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How maximum entropy follows from the Pythagorean theorem</title>
<desc>Left: a sketch of a right-angled triangle formed by the uniform distribution, the maximum-entropy point on the sheet of allowed distributions, and another allowed distribution; the e-geodesic from the uniform distribution meets the sheet at a right angle. Right: the divergence from the uniform distribution along the sheet is a bowl; its lowest level is the same distance D of P-hat from the uniform distribution for every point, and the extra height above that level is the divergence D of P from P-hat.</desc>
