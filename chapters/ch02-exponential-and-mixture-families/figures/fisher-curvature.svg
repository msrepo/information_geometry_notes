<svg viewBox="0 0 700 310" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Fisher metric as curvature of psi</title>
<desc>Left panel: psi of theta for the Bernoulli family with a tangent line whose slope is the mean. Right panel: its second derivative p times one minus p, the Fisher metric.</desc>
