<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Maximum likelihood as an m-projection</title>
<desc>Left: four data points on a line and the zero-mean bell curve fitted to them. Right: the plane of the two expectation parameters; the data define one observed point, the model of zero-mean Gaussians is a vertical line, and the maximum likelihood estimate is the foot of the horizontal straight line dropped from the observed point to the model, meeting it at a right angle. The estimate keeps the second coordinate of the observed point and ignores the first.</desc>
