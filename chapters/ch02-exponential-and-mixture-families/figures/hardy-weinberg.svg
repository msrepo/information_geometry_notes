<text class="v" x="265.6" y="355.9">p̂ (q̂ = 0.6)</text>
<line class="ln s2" x1="450" y1="130" x2="482" y2="130"/><text class="sm" x="488" y="134">the model: an e-flat curve (a straight line in θ)</text>
<line class="dash s0" x1="450" y1="154" x2="482" y2="154"/><text class="sm" x="488" y="158">m-geodesic from the observed point to its m-projection:</text>
<text class="sm" x="488" y="174">a straight segment in the triangle</text>
<text class="sm" x="450" y="212">Observed frequencies p̄ (blue, green, yellow) are projected onto the curve</text>
<text class="sm" x="450" y="230">along straight lines; the feet (orange) are the maximum</text>
<text class="sm" x="450" y="248">likelihood estimates: q̂ = (2 n_AA + n_Aa)/(2N) = 0.6, 0.45, 0.2.</text>
<text class="sm" x="450" y="276">For p̄ = (0.4, 0.4, 0.2): KL[p̄ : p̂] = 0.013844, and</text>
<text class="sm" x="450" y="294">KL[p̄ : p(q)] = KL[p̄ : p̂] + KL[p̂ : p(q)] for every q.</text>
