<svg viewBox="0 0 720 350" xmlns="http://www.w3.org/2000/svg" role="img">
<title>A Gaussian family and its cumulant generating function</title>
<desc>Left: four bell curves with the same width and different means. Middle: the convex curve psi of theta equal to theta squared over two, which is the cumulant generating function of the unit-variance Gaussian; the four coloured dots are the four bell curves, the slope of the curve at each dot is the mean of that bell curve, and one tangent line is drawn. Right: the same function for three different widths; a wider family gives a more sharply curved function, so the curvature is the variance.</desc>
