<text class="hd" x="120" y="28" text-anchor="middle">A family of Gaussians</text>
<text class="sm" x="120" y="46" text-anchor="middle">same width, different means θ</text>
<text class="hd" x="360" y="28" text-anchor="middle">Its cumulant generating function</text>
<text class="sm" x="360" y="46" text-anchor="middle">ψ(θ): a convex bowl; each dot is one Gaussian</text>
<text class="hd" x="600" y="28" text-anchor="middle">Curvature is the variance</text>
<text class="sm" x="600" y="46" text-anchor="middle">wider Gaussians give a more curved ψ</text>
<text class="sm" x="360" y="330" text-anchor="middle">matching colours: each curve on the left is the dot of the same colour in the middle; the slope there is that curve's mean</text>
