<path class="mk" d="M 509.0,272 l -5,9 l 10,0 z"/>
<text class="sm" x="480.0" y="296" text-anchor="middle">average 4.5</text>
<text class="hd" x="480" y="28" text-anchor="middle">Two-point</text><text class="sm" x="480" y="46" text-anchor="middle">all mass on two faces</text>
<text class="sm" x="480" y="314" text-anchor="middle">face</text>
<text class="sm" transform="translate(395 246) rotate(-90)" text-anchor="start">probability</text>
<line class="ax" x1="585" y1="250" x2="735" y2="250"/><line class="ax" x1="585" y1="250" x2="585" y2="120"/>
<rect class="or" x="593" y="217.0" width="17" height="33.0"/>
<text class="sm" x="601" y="264" text-anchor="middle">1</text>
<rect class="or" x="618" y="217.0" width="17" height="33.0"/>
<text class="sm" x="626" y="264" text-anchor="middle">2</text>
<rect class="or" x="643" y="217.0" width="17" height="33.0"/>
<text class="sm" x="651" y="264" text-anchor="middle">3</text>
<rect class="or" x="668" y="217.0" width="17" height="33.0"/>
<text class="sm" x="676" y="264" text-anchor="middle">4</text>
<rect class="or" x="693" y="217.0" width="17" height="33.0"/>
<text class="sm" x="701" y="264" text-anchor="middle">5</text>
<rect class="or" x="718" y="85.0" width="17" height="165.0"/>
<text class="sm" x="726" y="264" text-anchor="middle">6</text>
<path class="mk" d="M 689.0,272 l -5,9 l 10,0 z"/>
<text class="sm" x="660.0" y="296" text-anchor="middle">average 4.5</text>
<text class="hd" x="660" y="28" text-anchor="middle">Lopsided</text><text class="sm" x="660" y="46" text-anchor="middle">a spike on six</text>
<text class="sm" x="660" y="314" text-anchor="middle">face</text>
<text class="sm" transform="translate(575 246) rotate(-90)" text-anchor="start">probability</text>
<text class="sm" x="380" y="338" text-anchor="middle">triangle: the average of each distribution; the three on the right all satisfy "average 4.5", and blue is the one with the highest entropy</text>
</svg>