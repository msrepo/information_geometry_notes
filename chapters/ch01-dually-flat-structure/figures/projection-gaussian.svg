<svg viewBox="0 0 700 410" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Projecting a Gaussian onto the zero-mean Gaussians</title>
<desc>Left: the (mu, sigma) plane with the vertical line S of zero-mean Gaussians, the Gaussian P = N(1.5, 1), the m-geodesic from P to S, an arc of the circle mu^2 + sigma^2 = 3.25 that meets S at R-hat = N(0, 3.25), and the horizontal e-geodesic that meets S at N(0, 1). Right: KL[P:R] along S and KL[P:R-hat] + KL[R-hat:R] coincide, with minimum 0.5893 at sigma = 1.8028, while KL[R:P] has its minimum 1.1250 at sigma = 1.</desc>
