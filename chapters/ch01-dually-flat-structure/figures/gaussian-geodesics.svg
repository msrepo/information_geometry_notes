<svg viewBox="0 0 820 332" xmlns="http://www.w3.org/2000/svg" role="img">
<title>e-, m- and Fisher-Rao geodesics between two Gaussians</title>
<desc>The three curves joining N(0, 1) and N(1.5, 1.5^2), drawn in the (mu, sigma) plane, in natural coordinates, and in moment coordinates. The e-geodesic is straight in natural coordinates, the m-geodesic is straight in moment coordinates, and the Fisher-Rao geodesic, the shortest path, is straight in neither.</desc>
