<svg viewBox="0 0 560 424" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Fisher-Rao geodesics on the Gaussians</title>
<desc>The Gaussian manifold drawn as the upper half-plane with x = mu/sqrt(2) and y = sigma. Its geodesics for the Fisher metric are vertical lines and semicircles centred on the axis y = 0. The geodesic from N(0, 1) to N(1.5, 1.5^2) is a semicircle of length 1.3070; the straight chord between the same points has length 1.3448.</desc>
