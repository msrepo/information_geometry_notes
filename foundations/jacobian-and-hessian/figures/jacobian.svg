<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The Jacobian as the local linear map</title>
<desc>Left: a square grid in the input plane with one small cell and its two edge steps. Right: the same grid after a smooth map f has bent it; near the marked point the small cell becomes almost a parallelogram, and the two edge steps become the two columns of the Jacobian.</desc>
