.hd{font-size:13px;font-weight:500;fill:#1a1a19} .sm{font-size:11px;fill:#57564f} .v{font-size:12px;fill:#1a1a19}
.ax{stroke:#c9c8c0;stroke-width:1;fill:none} .tick{stroke:#8a8880;stroke-width:1}
.cv{fill:none;stroke:#1a1a19;stroke-width:2.6;stroke-linejoin:round}
.tg{stroke:#2a78d6;stroke-width:2;fill:none} .gap{stroke:#eb6834;stroke-width:4;stroke-linecap:round}
.par{fill:none;stroke:#8a8880;stroke-width:1.8;stroke-dasharray:5 4}
.ring{stroke:#fdfdfc;stroke-width:3.5;paint-order:stroke;stroke-linejoin:round}
.dot{fill:#1a1a19}
@media (prefers-color-scheme: dark){ .hd,.v{fill:#eceae3} .sm{fill:#b6b4ab} .ax{stroke:#4a4844} .cv{stroke:#eceae3} .tg{stroke:#3987e5} .gap{stroke:#d95926} .par{stroke:#85837b} .ring{stroke:#161615} .dot{fill:#eceae3} }
</style>
