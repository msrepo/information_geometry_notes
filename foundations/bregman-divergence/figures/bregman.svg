<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The Bregman divergence as the gap to a tangent</title>
<desc>Left and middle: the same convex curve and two points p and q. The tangent is drawn at q, and the vertical gap between the curve and the tangent at p is the Bregman divergence from p to q. Swapping the roles of p and q changes the gap, so the divergence is not symmetric. Right: near q the curve is close to a dashed parabola on top of its tangent, so for nearby points the gap is a bowl set by the curvature at q.</desc>
