<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Discrepancy, divergence and distance as a ladder of rules</title>
<desc>A table with three rows, discrepancy, divergence and distance, and four columns, the four rules of a distance. A discrepancy asks for none of them, a divergence asks for the first two and may fail the other two, and a distance satisfies all four.</desc>
<style>
text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
.hd{font-size:13px;font-weight:500;fill:#1a1a19} .sm{font-size:11px;fill:#57564f}
.sh0{fill:#8a8880;fill-opacity:.12} .sh1{fill:#2a78d6;fill-opacity:.12} .sh2{fill:#1baf7a;fill-opacity:.16}
.ok{font-size:18px;fill:#1b7a52} .no{font-size:12px;fill:#a0522d} .nr{font-size:16px;fill:#8a8880}
@media (prefers-color-scheme: dark){ .hd{fill:#eceae3} .sm{fill:#b6b4ab} .sh0{fill:#85837b} .sh1{fill:#3987e5} .sh2{fill:#199e70} .ok{fill:#5fd0a0} .no{fill:#e09a73} .nr{fill:#85837b} }
</style>
<text class="hd" x="265" y="70" text-anchor="middle">non-negative</text>
<text class="hd" x="395" y="70" text-anchor="middle">zero only when equal</text>
<text class="hd" x="525" y="70" text-anchor="middle">symmetric</text>
<text class="hd" x="655" y="70" text-anchor="middle">triangle inequality</text>
<text class="sm" x="176" y="70" text-anchor="end" style="font-size:11px">rules (numbered as on the page)</text>
<rect class="sh0" x="20" y="88" width="720" height="62" rx="4"/>
<text class="hd" x="34" y="112">Discrepancy</text>
<text class="sm" x="34" y="130">asks for: none required</text>
<text class="nr" x="265" y="118" text-anchor="middle">—</text>
<text class="nr" x="395" y="118" text-anchor="middle">—</text>
<text class="nr" x="525" y="118" text-anchor="middle">—</text>
<text class="nr" x="655" y="118" text-anchor="middle">—</text>
<text class="sm" x="34" y="146" text-anchor="start">example: any loose measure of how different two things are</text>
<rect class="sh1" x="20" y="158" width="720" height="62" rx="4"/>
<text class="hd" x="34" y="182">Divergence</text>
<text class="sm" x="34" y="200">asks for: first two</text>
<text class="ok" x="265" y="188" text-anchor="middle">✓</text>
<text class="ok" x="395" y="188" text-anchor="middle">✓</text>
<text class="no" x="525" y="188" text-anchor="middle">may fail</text>
<text class="no" x="655" y="188" text-anchor="middle">may fail</text>
<text class="sm" x="34" y="216" text-anchor="start">example: KL, Bregman, squared length</text>
<rect class="sh2" x="20" y="228" width="720" height="62" rx="4"/>
<text class="hd" x="34" y="252">Distance</text>
<text class="sm" x="34" y="270">asks for: all four</text>
<text class="ok" x="265" y="258" text-anchor="middle">✓</text>
<text class="ok" x="395" y="258" text-anchor="middle">✓</text>
<text class="ok" x="525" y="258" text-anchor="middle">✓</text>
<text class="ok" x="655" y="258" text-anchor="middle">✓</text>
<text class="sm" x="34" y="286" text-anchor="start">example: straight-line length</text>
<text class="sm" x="380" y="318" text-anchor="middle">each step up the ladder asks for more: a distance is a divergence, and a divergence is a discrepancy, but not the other way round</text>
</svg>