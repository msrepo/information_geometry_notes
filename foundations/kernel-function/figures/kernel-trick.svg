<svg viewBox="0 0 720 356" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The kernel trick</title>
<desc>Input space with two points x and y, feature space with their images phi of x and phi of y, a long dashed route through the feature space and a short shortcut that evaluates the kernel k of x and y directly.</desc>
<style>
text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
.hd{font-size:13px;font-weight:500;fill:#1a1a19} .sm{font-size:11px;fill:#57564f} .v{font-size:12px;fill:#1a1a19}
.ax{stroke:#8a8880;stroke-width:1;fill:none} .grid{stroke:#c9c8c0;stroke-width:.6}
.bl{fill:#2a78d6} .or{fill:#eb6834} .gr{fill:#1f8a63} .pu{fill:#6a5fd0}
.blf{fill:#2a78d6;fill-opacity:.3;stroke:#2a78d6;stroke-width:2} .orf{fill:#eb6834;fill-opacity:.3;stroke:#eb6834;stroke-width:2}
.grf{fill:#1f8a63;fill-opacity:.3;stroke:#1f8a63;stroke-width:2} .puf{fill:#6a5fd0;fill-opacity:.3;stroke:#6a5fd0;stroke-width:2}
.bs{fill:#2a78d6;fill-opacity:.75} .os{fill:#eb6834;fill-opacity:.75} .gs{fill:#1f8a63;fill-opacity:.75}
.blc{fill:none;stroke:#2a78d6;stroke-width:2.4} .orc{fill:none;stroke:#eb6834;stroke-width:2.4} .grc{fill:none;stroke:#1f8a63;stroke-width:2.4} .puc{fill:none;stroke:#6a5fd0;stroke-width:2.4}
.dsh{fill:none;stroke:#8a8880;stroke-width:1.4;stroke-dasharray:4 3}
.lor{font-size:12px;fill:#c2481f} .lbl{font-size:12px;fill:#2a78d6} .lgr{font-size:12px;fill:#13644a}
@media (prefers-color-scheme: dark){ .hd,.v{fill:#eceae3} .sm{fill:#b6b4ab} .ax{stroke:#85837b} .grid{stroke:#4a4844} .bl{fill:#3987e5} .or{fill:#d95926} .gr{fill:#3cb58a} .pu{fill:#9d95f0}
.blf{fill:#3987e5;stroke:#3987e5} .orf{fill:#d95926;stroke:#d95926} .grf{fill:#3cb58a;stroke:#3cb58a} .puf{fill:#9d95f0;stroke:#9d95f0}
.bs{fill:#3987e5} .os{fill:#d95926} .gs{fill:#3cb58a} .blc{stroke:#3987e5} .orc{stroke:#d95926} .grc{stroke:#3cb58a} .puc{stroke:#9d95f0} .dsh{stroke:#85837b} .lor{fill:#f0916b} .lbl{fill:#6ba6ee} .lgr{fill:#6fd0a8} }
</style>
<text class="hd" x="20" y="22">The kernel trick: take the inner product in feature space without ever building the feature space</text><rect class="box" x="30" y="60" width="150" height="210" rx="8" fill="none" stroke="#c9c8c0"/><text class="hd" x="105" y="84" text-anchor="middle">input space</text><circle class="bl" cx="75" cy="150" r="6"/><text class="v" x="88" y="154">x</text><circle class="or" cx="125" cy="210" r="6"/><text class="v" x="138" y="214">y</text><rect x="500" y="60" width="190" height="210" rx="8" fill="none" stroke="#c9c8c0"/><text class="hd" x="595" y="84" text-anchor="middle">feature space</text><text class="sm" x="595" y="100" text-anchor="middle">(possibly infinite coordinates)</text><line class="grc" x1="540" y1="230" x2="595" y2="150"/><line class="orc" x1="540" y1="230" x2="650" y2="200"/><circle class="gr" cx="595" cy="150" r="5"/><text class="v" x="605" y="146">φ(x)</text><circle class="or" cx="650" cy="200" r="5"/><text class="v" x="660" y="196">φ(y)</text><text class="sm" x="600" y="256" text-anchor="middle">⟨φ(x), φ(y)⟩ = angle and lengths</text><path class="dsh" d="M190,100 C300,60 400,60 490,100" /><text class="v" x="340" y="64" text-anchor="middle">long way: build φ(x), φ(y), take the dot product</text><path class="blc" d="M190,230 C300,280 400,280 490,230" /><text class="v" x="340" y="290" text-anchor="middle">shortcut: evaluate k(x, y) with a formula</text><text class="sm" x="30" y="324">Same number either way. Example: in the plane, k(x, y) = (x·y)² equals the 3-term dot product of φ(x) = (x₁², √2 x₁x₂, x₂²).</text><text class="sm" x="30" y="342">Gaussian, one dimension: e^(−(x−y)²/2) = e^(−x²/2) e^(−y²/2) times a sum over n of (xⁿ/√n!)(yⁿ/√n!): an infinite dot product with a one-line closed form.</text>
</svg>
