<svg viewBox="0 0 720 372" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Functions in a reproducing kernel Hilbert space</title>
<desc>Left: a smooth sum of two same-sign bumps. Middle: a small wiggle made from two close bumps with large opposite weights, which has a large norm. Right: f drawn as an arrow, the bump at x as another arrow, and the dot product of the two as the value f of x.</desc>
