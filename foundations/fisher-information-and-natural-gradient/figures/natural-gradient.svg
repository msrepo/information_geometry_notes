<polyline class="gd" points="28.0,142.5 69.2,230.7 98.8,170.7 120.1,211.5 135.5,183.8 146.6,202.6 154.5,189.8 160.3,198.5 164.4,192.6 167.4,196.6"/>
<circle class="gdp" cx="28.0" cy="142.5" r="2.8"/>
<circle class="gdp" cx="69.2" cy="230.7" r="2.8"/>
<circle class="gdp" cx="98.8" cy="170.7" r="2.8"/>
<circle class="gdp" cx="120.1" cy="211.5" r="2.8"/>
<circle class="gdp" cx="135.5" cy="183.8" r="2.8"/>
