<circle class="dot" cx="440.0" cy="153.0" r="4"/>
<text class="sm ring" x="480.0" y="91.0" text-anchor="middle">the Fisher ellipse: steps of equal</text>
<text class="sm ring" x="480.0" y="105.0" text-anchor="middle">change in the distribution</text>
<text class="sm ring" x="454.0" y="235.0" style="fill:#2a78d6">−gradient</text>
<text class="sm ring" x="480.0" y="157.0" style="fill:#c4501f">−G⁻¹ gradient</text>
<text class="hd" x="175" y="28" text-anchor="middle">Going down a thin valley</text>
<text class="sm" x="175" y="46" text-anchor="middle">contours of the loss; + marks the minimum</text>
<text class="hd" x="545" y="28" text-anchor="middle">Why they differ at one point</text>
<text class="sm" x="545" y="46" text-anchor="middle">the Fisher matrix reshapes the step</text>
<text class="sm" x="360" y="360" text-anchor="middle">the loss and the Fisher ellipse share the same stretched shape here, which is what makes the natural gradient aim straight at the minimum</text>
</svg>