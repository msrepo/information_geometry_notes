<text class="v ring" x="22.0" y="132.5">start</text>
<text class="sm ring" x="175.0" y="321.0" text-anchor="middle" style="fill:#2a78d6">ordinary gradient: zigzags across the valley</text>
<text class="sm ring" x="175.0" y="337.0" text-anchor="middle" style="fill:#c4501f">natural gradient: straight to the minimum</text>
