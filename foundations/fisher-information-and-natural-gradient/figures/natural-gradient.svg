<svg viewBox="0 0 720 374" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Ordinary and natural gradient in a long thin valley</title>
<desc>Left: contour lines of a loss that is long in one direction and narrow in the other. Gradient descent zigzags across the narrow valley, while the natural gradient goes almost straight to the minimum. Right: at one point, the Fisher ellipse shows which parameter steps change the distribution by the same amount; the ordinary negative gradient points mostly across the valley while the natural gradient, corrected by the inverse of the Fisher matrix, points along it toward the minimum.</desc>
<style>
text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
.hd{font-size:13px;font-weight:500;fill:#1a1a19} .sm{font-size:11px;fill:#57564f} .v{font-size:12px;fill:#1a1a19}
.fr{fill:none;stroke:#c9c8c0;stroke-width:1} .ct{fill:none;stroke:#8a8880;stroke-width:1.4}
.star{fill:none;stroke:#1a1a19;stroke-width:2}
.gd{fill:none;stroke:#2a78d6;stroke-width:1.8} .gdp{fill:#2a78d6}
.nat{fill:none;stroke:#eb6834;stroke-width:2.4} .natp{fill:#eb6834}
.fish{fill:#eb6834;fill-opacity:.14;stroke:#eb6834;stroke-width:1.6;stroke-dasharray:5 3}
.ag{stroke:#2a78d6;stroke-width:2.6;stroke-linecap:round;fill:none} .an{stroke:#eb6834;stroke-width:2.6;stroke-linecap:round;fill:none}
.ring{stroke:#fdfdfc;stroke-width:3.5;paint-order:stroke;stroke-linejoin:round} .dot{fill:#1a1a19}
@media (prefers-color-scheme: dark){ .hd,.v{fill:#eceae3} .sm{fill:#b6b4ab} .fr{stroke:#4a4844} .ct{stroke:#85837b} .star{stroke:#eceae3} .gd,.ag{stroke:#3987e5} .gdp{fill:#3987e5} .nat,.an,.fish{stroke:#d95926} .natp{fill:#d95926} .fish{fill:#d95926} .ring{stroke:#161615} .dot{fill:#eceae3} }
</style>
