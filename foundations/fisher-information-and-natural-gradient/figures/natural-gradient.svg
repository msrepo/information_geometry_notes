<ellipse class="ct" style="opacity:1" cx="175" cy="195" rx="56.0" ry="22.9"/>
<ellipse class="ct" style="opacity:1" cx="175" cy="195" rx="98.0" ry="40.0"/>
<ellipse class="ct" style="opacity:1" cx="175" cy="195" rx="140.0" ry="57.2"/>
<path class="star" d="M 175,195 m -5,0 h 10 m -5,-5 v 10"/>
<ellipse class="ct" style="opacity:0.8" cx="545" cy="195" rx="56.0" ry="22.9"/>
