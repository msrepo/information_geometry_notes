.fr{fill:none;stroke:#c9c8c0;stroke-width:1} .ct{fill:none;stroke:#8a8880;stroke-width:1.6;stroke-dasharray:5 3}
.ab{stroke:#2a78d6;stroke-width:2;stroke-linecap:round;fill:none} .ao{stroke:#eb6834;stroke-width:2;stroke-linecap:round;fill:none}
.loop{fill:none;stroke:#8a8880;stroke-width:1.4;stroke-dasharray:3 4} .loopa{fill:none;stroke:#8a8880;stroke-width:1.4}
.dot{fill:#1a1a19}
@media (prefers-color-scheme: dark){ .hd{fill:#eceae3} .sm{fill:#b6b4ab} .fr{stroke:#4a4844} .ct,.loop,.loopa{stroke:#85837b} .ab{stroke:#3987e5} .ao{stroke:#d95926} .dot{fill:#eceae3} }
