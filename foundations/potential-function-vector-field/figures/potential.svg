<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>A potential and its vector field, and a field with no potential</title>
<desc>Left: a hill drawn with elliptical contour lines; the arrows are the slope of the hill, each pointing uphill and crossing the contours at right angles. Right: a swirling field whose arrows circle the centre; walking once around the marked loop you are pushed along the whole way, which no hill could produce, so this field has no potential.</desc>
