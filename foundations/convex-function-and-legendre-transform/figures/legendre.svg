text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
.hd{font-size:13px;font-weight:500;fill:#1a1a19} .sm{font-size:11px;fill:#57564f}
.ax{stroke:#c9c8c0;stroke-width:1;fill:none}
.cv{fill:none;stroke:#1a1a19;stroke-width:2.6;stroke-linejoin:round}
.ch{stroke:#eb6834;stroke-width:2;fill:none} .tg{stroke:#2a78d6;stroke-width:2;fill:none}
.tg2{stroke:#2a78d6;stroke-width:1;stroke-opacity:.45;fill:none} .hi{stroke:#2a78d6;stroke-width:2.6;fill:none}
.ring{stroke:#fdfdfc;stroke-width:3.5;paint-order:stroke;stroke-linejoin:round} .dot{fill:#1a1a19} .ofill{fill:#eb6834}
@media (prefers-color-scheme: dark){ .hd{fill:#eceae3} .sm{fill:#b6b4ab} .ax{stroke:#4a4844} .cv{stroke:#eceae3} .ch,.ofill{stroke:#d95926;fill:#d95926} .ch{fill:none} .tg,.hi{stroke:#3987e5} .tg2{stroke:#3987e5} .dot{fill:#eceae3} .ring{stroke:#161615} }
</style>
