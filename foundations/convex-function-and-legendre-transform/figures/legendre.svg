<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>A convex function and its Legendre transform</title>
<desc>Left: a convex curve with a chord lying above it and a tangent line lying below it. Right: the same curve and the family of its tangent lines, each labelled by its slope; the tangent of one chosen slope is highlighted and its intercept with the vertical axis, which equals minus the Legendre transform at that slope, is marked.</desc>
