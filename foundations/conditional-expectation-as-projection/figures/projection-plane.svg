<svg viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Conditional expectation as an orthogonal projection onto the plane of functions of Y</title>
<desc>A random variable X is an arrow sticking out of a plane of all functions g of Y. Its foot on the plane is the conditional expectation. The residual from the foot up to X is perpendicular to the plane. Any other point of the plane is farther from X, by Pythagoras.</desc>
<style>
text{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-weight:400}
.hd{font-size:13px;font-weight:500;fill:#1a1a19} .sm{font-size:11px;fill:#57564f} .v{font-size:12px;fill:#1a1a19}
.bl{fill:#2a78d6} .or{fill:#eb6834} .gr{fill:#1f8a63} .gy{fill:#8a8880}
.lbl{font-size:12px;fill:#2a78d6} .lor{font-size:12px;fill:#c2481f} .lgr{font-size:12px;fill:#13644a}
.plane{fill:#dff3ea;stroke:#1f8a63;stroke-width:1} .box{fill:none;stroke:#c9c8c0;stroke-width:1}
.bar{stroke:#2a78d6;stroke-width:2.6;fill:none} .res{stroke:#eb6834;stroke-width:2.4;fill:none}
.mm{stroke:#1f8a63;stroke-width:3;fill:none} .gl{stroke:#8a8880;stroke-width:1.5;fill:none} .dsh{stroke:#8a8880;stroke-width:1.5;stroke-dasharray:4 3;fill:none}
.og{stroke:#eb6834;stroke-width:3;fill:none} .grid{stroke:#c9c8c0;stroke-width:1}
@media (prefers-color-scheme: dark){ .hd,.v{fill:#eceae3} .sm{fill:#b6b4ab} .bl{fill:#3987e5} .or{fill:#d95926} .gr{fill:#3cb58a} .gy{fill:#85837b} .lbl{fill:#6ba6ee} .lor{fill:#f0916b} .lgr{fill:#6fd0a8} .plane{fill:#173a2e;stroke:#3cb58a} .box,.grid{stroke:#4a4844} .bar{stroke:#3987e5} .res{stroke:#d95926} .mm{stroke:#3cb58a} .gl,.dsh{stroke:#85837b} .og{stroke:#d95926} }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<polygon class="plane" points="90,320 450,320 590,225 230,225"/>
<text class="lgr" x="120" y="308">M = all functions g(Y)</text>
<circle class="gy" cx="250" cy="275" r="3.5"/><text class="sm" x="232" y="296">0</text>
<line x1="250" y1="275" x2="400" y2="95" class="bar" marker-end="url(#a)"/><text class="lbl" x="296" y="150" text-anchor="end">X</text>
<line x1="250" y1="275" x2="400" y2="262" stroke="#1f8a63" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="400" y1="262" x2="400" y2="98" class="res" stroke-dasharray="6 4"/>
<polyline points="400,246 416,246 416,262" class="res" stroke-width="1.5"/>
<circle class="gr" cx="400" cy="262" r="4"/><text class="lgr" x="400" y="288" text-anchor="middle">E[X|Y]</text>
<text class="lor" x="412" y="175">X − E[X|Y]</text><text class="sm" x="412" y="193">residual, perpendicular to M</text>
<circle class="gy" cx="520" cy="250" r="4"/><text class="sm" x="528" y="272">another g(Y)</text>
<line x1="520" y1="250" x2="400" y2="95" class="dsh"/><line x1="400" y1="262" x2="520" y2="250" class="gl"/>
<circle class="bl" cx="400" cy="95" r="4.5"/><text class="sm" x="500" y="150">longer: error of the other g</text>
<text class="v" x="40" y="355">‖X − g‖² = ‖X − E[X|Y]‖² + ‖E[X|Y] − g‖²   (Pythagoras)</text>
</svg>
